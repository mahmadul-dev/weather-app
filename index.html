<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
    }

    .card {
      max-width: 470px;
      width: 90%;
      padding: 20px;
      border-radius: 10px;
      background: #2f2f36;
      background: linear-gradient(90deg, rgba(47, 47, 54, 1) 0%, rgba(9, 9, 121, 1) 35%, rgba(0, 212, 255, 1) 100%);
      text-align: center;
      margin: 50px auto;
    }

    .search {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .search input {
      border: 0;
      outline: 0;
      font-size: 20px;
      color: #555;
      height: 50px;
      padding: 20px;
      border-radius: 30px;
      flex: 1;
      margin-right: 16px
    }

    .search button {
      height: 50px;
      width: 50px;
      border-radius: 50%;
      /* padding: 10px; */
      border: 0;
      outline: 0;
      cursor: pointer;
      /* font-size: 10px; */
    }

    .search button img {
      width: 24px;
    }

    .weather img {
      width: 90px;
      margin-top: 20px;
      margin-bottom: 10px
    }

    .details {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
    }

    .col {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .col img {
      width: 50px;
      margin-right: 15px;
    }

    p {
      font-size: 13px;
    }

    .wind,
    .humidity {
      font-size: 20px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="search">
      <input type="text" spellcheck="false" placeholder="type city name..">
      <button><img src="./images/search.png" alt="Search"></button>
    </div>
    <div class="weather">

      <img src="images/rain.png" alt="Weather" class="weather-icon">
      <h1 class="temp">22°C</h1>
      <h2 class="city">New York</h2>

      <div class="details">
        <div class="col">
          <img src="images/humidity.png" alt="Humidity">
          <div>
            <p class="humidity">50%</p>
            <p>Humidity</p>
          </div>

        </div>
        <div class="col">
          <img src="images/wind.png" alt="Humidity">
          <div>
            <p class="wind">15 km/hour</p>
            <p>Wind Speed</p>
          </div>

        </div>
      </div>
    </div>
  </div>



  <script>
    const apiKey = "7121b8eb7affcaf5ca2519548bb8f3be";
    const apiUrl = "https://api.openweathermap.org/data/2.5/weather?&units=metric&q="
    let weatherIcon = document.querySelector(".weather-icon")
    let searchBox = document.querySelector(".search input")

    let searchBtn = document.querySelector(".search button")


    async function checkWeather(cityName) {
      const response = await fetch(apiUrl + cityName + `&appid=${apiKey}`)
      let data = await response.json();
      console.log(data);

      let temp = document.querySelector(".temp")
      temp.innerHTML = Math.round(data.main.temp) + "°C"

      let city = document.querySelector(".city")
      city.innerHTML = data.name;

      let wind = document.querySelector(".wind")
      wind.innerHTML = data.wind.speed + " km/hour";

      let humidity = document.querySelector(".humidity")
      humidity.innerHTML = data.main.humidity + "%";

      if (data.weather[0].main == "Clear") {
        weatherIcon.src = "images/clear.png";
      }
      else if (data.weather[0].main == "Clouds") {
        weatherIcon.src = "images/clouds.png";
      }
      else if (data.weather[0].main == "Drizzle") {
        weatherIcon.src = "images/drizzle.png";
      }
      else if (data.weather[0].main == "Humidity") {
        weatherIcon.src = "images/humidity.png";
      }
      else if (data.weather[0].main == "Mist") {
        weatherIcon.src = "images/mist.png";
      }
      else if (data.weather[0].main == "Rain") {
        weatherIcon.src = "images/rain.png";
      }
      else if (data.weather[0].main == "Search") {
        weatherIcon.src = "images/search.png";
      }
      else if (data.weather[0].main == "Snow") {
        weatherIcon.src = "images/snow.png";
      }
      else if (data.weather[0].main == "Wind") {
        weatherIcon.src = "images/wind.png";
      }

    }



    searchBtn.addEventListener("click", () => {
      checkWeather(searchBox.value)
    })


  </script>
</body>

</html>
